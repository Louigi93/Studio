<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Studio - Boutique Hotel Bruges</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="the-studio-icon-dark-no-text.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ── Login ─────────────────────────────────────────────── -->
    <div class="login-container" id="loginContainer">
        <img src="the-studio-icon-dark-no-text.png" class="logo" alt="The Studio Logo">
        <p class="subtitle">Bruges Boutique Hotel</p>
        <p id="loginError" class="error-msg"></p>
        <input type="password" id="passwordInput" placeholder="Access Code" autocomplete="off">
        <button onclick="app.login()">Enter</button>
    </div>

    <!-- ── Main app ───────────────────────────────────────────── -->
    <div class="container" id="mainContainer">
        <div class="header">
            <button class="logout-btn" onclick="app.logout()">Sign Out</button>
            <img src="the-studio-icon-light-no-text.png" alt="The Studio Logo" class="logo">
            <p>Boutique Hotel Reservation System</p>
        </div>

        <div class="content">

            <!-- Guest selection -->
            <div class="form-section">
                <h2>Guest Selection</h2>
                <div class="person-selector">
                    <button class="person-btn" data-person="Louis">Louis</button>
                    <button class="person-btn" data-person="Victor">Victor</button>
                    <button class="person-btn" data-person="Chantal & Reinout">Chantal &amp; Reinout</button>
                </div>
            </div>

            <!-- Date picker -->
            <div class="form-section">
                <h2>Select Your Dates</h2>
                <div class="calendar">
                    <div class="calendar-header">
                        <button id="prevMonth">← Previous</button>
                        <h3 id="currentMonth"></h3>
                        <button id="nextMonth">Next →</button>
                    </div>
                    <div class="calendar-grid" id="calendarGrid"></div>
                    <div class="range-hint">
                        <span id="rangeHintText">Click a start date, then click an end date</span>
                        <button class="clear-selection-btn" id="clearSelectionBtn">Clear</button>
                    </div>
                </div>
            </div>

            <!-- Submit -->
            <div class="submit-section">
                <button class="submit-btn" id="submitBtn" disabled>Confirm Reservation</button>
            </div>

            <div class="message" id="message"></div>

            <!-- Reservations overview -->
            <div class="bookings-section">
                <h2>Reservations Overview</h2>
                <h3 class="section-subtitle">Current Reservations</h3>
                <div id="currentBookingsList"></div>
            </div>

        </div>
    </div>

    <!-- ── Loading overlay ────────────────────────────────────── -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <p>Connecting to database...</p>
        </div>
    </div>

    <!-- ── Confirmation modal ─────────────────────────────────── -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>Confirm Reservation</h2>
            <div class="modal-body">
                <div class="modal-row">
                    <span class="modal-label">Guest</span>
                    <span class="modal-value" id="modalPerson"></span>
                </div>
                <div class="modal-row">
                    <span class="modal-label">Duration</span>
                    <span class="modal-value" id="modalNights"></span>
                </div>
                <div class="modal-row">
                    <span class="modal-label">Dates</span>
                    <span class="modal-dates-list" id="modalDates"></span>
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-back-btn" id="modalBackBtn">Back</button>
                <button class="modal-confirm-btn" id="modalConfirmBtn">Confirm Booking</button>
            </div>
        </div>
    </div>

    <!-- ── Service worker registration ───────────────────────── -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>

    <!-- ── App (ES module) ────────────────────────────────────── -->
    <script type="module" src="app.js"></script>

</body>
</html>
